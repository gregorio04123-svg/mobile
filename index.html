<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pilares</title>
<meta name="description" content="Rutina de gimnasio, agenda academica y libreticas de dinero en una sola aplicacion.">
<meta name="theme-color" content="#090C14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilares">
<meta property="og:title" content="Pilares">
<meta property="og:description" content="Ejercicio, estudio y finanzas en una sola aplicacion.">
<meta property="og:type" content="website">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Newsreader:ital,opsz,wght@1,6..72,200..400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="screen"></div>

<!-- Plantilla del diseno: la interpreta assets/runtime.js -->
<template id="dc-template">
<div style="height:100dvh;display:flex;flex-direction:column;position:relative;background:#090C14;color:#fff;overflow:hidden">

<sc-if value="{{ loadOn }}">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center">
  <div style="font:italic 300 44px/1 Newsreader,Georgia,serif;color:#EDF1F7">Pilares</div>
  <sc-if value="{{ loadSpin }}">
    <div role="status" style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <pilares-orbe class="orbe-carga" tam="32" estado="searching"></pilares-orbe>
      <div style="font:700 10px/1 Manrope,sans-serif;letter-spacing:.2em;color:#8E9AAE">CARGANDO TUS DATOS</div>
    </div>
  </sc-if>
  <sc-if value="{{ loadErr }}">
    <div style="font:500 13px/1.5 Manrope,sans-serif;color:#8E9AAE;max-width:280px">{{ loadErr }}</div>
    <div style="display:flex;gap:9px;margin-top:6px">
      <div sc-camel-on-click="{{ salir }}" style="padding:14px 18px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font:700 13px/1 Manrope,sans-serif;color:#8E9AAE">Salir</div>
      <div sc-camel-on-click="{{ reintentar }}" style="padding:14px 22px;border-radius:12px;cursor:pointer;background:#CE7F55;font:800 13px/1 Manrope,sans-serif;color:#0A0E1A">Reintentar</div>
    </div>
  </sc-if>
</div>
</sc-if>

<sc-if value="{{ authOn }}">
<div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 54px) 26px calc(env(safe-area-inset-bottom,0px) + 28px)">
  <div style="text-align:center">
    <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.18em;color:#4A566B">EJERCICIO · ESTUDIO · FINANZAS</div>
    <div style="font:italic 300 48px/1.05 Newsreader,Georgia,serif;color:#EDF1F7;margin-top:12px">Pilares</div>
    <div style="font:500 12.5px/1.45 Manrope,sans-serif;color:#8E9AAE;margin-top:10px">{{ authSub }}</div>
  </div>

  <div style="display:flex;gap:6px;margin-top:30px;padding:4px;border-radius:14px;background:#121724;border:1px solid rgba(255,255,255,.07)">
    <sc-for list="{{ authTabs }}" as="at" hint-placeholder-count="2">
      <div sc-camel-on-click="{{ at.go }}" style="flex:1;padding:13px 8px;border-radius:11px;text-align:center;cursor:pointer;font:700 13px/1 Manrope,sans-serif;background:{{ at.bg }};color:{{ at.fg }}">{{ at.t }}</div>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;margin-top:22px">
    <sc-if value="{{ authCrearOn }}">
      <div>
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:7px">TU NOMBRE</div>
        <input value="{{ aNombre }}" sc-camel-on-change="{{ onANombre }}" autocomplete="name" placeholder="Como te verán tus amigos" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font:600 16px Manrope,sans-serif;padding:13px 14px">
      </div>
    </sc-if>
    <div>
      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:7px">USUARIO</div>
      <input value="{{ aUsuario }}" sc-camel-on-change="{{ onAUsuario }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ej. gregorio" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font:600 16px Manrope,sans-serif;padding:13px 14px">
    </div>
    <div>
      <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE;margin-bottom:7px">CONTRASEÑA</div>
      <input type="password" value="{{ aClave }}" sc-camel-on-change="{{ onAClave }}" autocomplete="{{ authAuto }}" placeholder="Mínimo 6 caracteres" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font:600 16px Manrope,sans-serif;padding:13px 14px">
    </div>
  </div>

  <sc-if value="{{ authErr }}">
    <div style="margin-top:14px;padding:12px 14px;border-radius:11px;background:rgba(196,100,97,.1);border:1px solid rgba(196,100,97,.3);font:600 12.5px/1.45 Manrope,sans-serif;color:#E08A87">{{ authErr }}</div>
  </sc-if>

  <div sc-camel-on-click="{{ authGo }}" style="margin-top:20px;padding:17px;border-radius:13px;text-align:center;cursor:pointer;background:{{ authBtnBg }};font:800 14.5px/1 Manrope,sans-serif;color:#0A0E1A" style-active="transform:translateY(1px)">{{ authCta }}</div>

  <div style="margin-top:auto;padding-top:26px">
    <sc-if value="{{ authNotaOn }}"><div style="padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);font:500 11.5px/1.5 Manrope,sans-serif;color:#8E9AAE;text-wrap:pretty">{{ authNota }}</div></sc-if>
  </div>
</div>
</sc-if>

<sc-if value="{{ appOn }}">

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;display:flex;flex-direction:column;position:relative">
  <div data-cabecera data-vidrio="cabecera" style="position:absolute;top:0;left:0;right:0;z-index:30">
  <div style="padding:calc(env(safe-area-inset-top,0px) + 12px) 60px 10px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px">
    <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.16em;color:#4A566B">{{ todayLine }}</div>
    <div style="font:italic 300 33px/1.12 Newsreader,Georgia,serif;letter-spacing:-.01em;color:#EDF1F7">Resumen</div>
    <div style="font:500 12px/1.35 Manrope,sans-serif;color:#8E9AAE">{{ homeSub }}</div>
    <div sc-camel-on-click="{{ openPanel }}" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:44px;height:44px;border-radius:12px;background:#121724;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9AA6BA" stroke-linecap="round">
        <path stroke-width="4.6" d="M20.2 12 L21.2 12 M3.8 12 L2.8 12 M12 20.2 L12 21.2 M12 3.8 L12 2.8 M17.8 17.8 L18.5 18.5 M6.2 6.2 L5.5 5.5 M6.2 17.8 L5.5 18.5 M17.8 6.2 L18.5 5.5"></path>
        <circle cx="12" cy="12" r="7.4" stroke-width="5.2"></circle>
      </svg>
      <sc-if value="{{ avisosBadge }}"><div style="position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#C46461;border:2px solid #090C14;font:800 10px/16px Manrope,sans-serif;color:#fff;text-align:center">{{ avisosBadgeTxt }}</div></sc-if>
    </div>
  </div>
  </div>

  <div data-desplaza style="flex:1;min-height:0;overflow:auto;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;flex-direction:column;gap:12px">

    <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
      <div sc-camel-on-click="{{ goNext }}" style="background:#121724;border:1px solid {{ nextBorder }};border-radius:16px;padding:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="font:700 8.5px/1 Manrope,sans-serif;letter-spacing:.14em;padding:5px 8px;border-radius:7px;background:{{ nextTint }};color:{{ nextColor }}">{{ nextBadge }}</div>
          <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.1em;color:{{ nextColor }}">{{ nextPlazo }}</div>
        </div>
        <div style="font:700 19px/1.2 Manrope,sans-serif;letter-spacing:-.2px;margin-top:13px;text-wrap:pretty">{{ nextTitle }}</div>
        <div style="font:600 11.5px/1.3 Manrope,sans-serif;color:#8E9AAE;margin-top:8px">{{ nextCuaderno }}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.06)">
          <div style="flex:1;font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;color:#8E9AAE">{{ nextFecha }}</div>
          <div style="font:700 11px/1 Manrope,sans-serif;color:#9AA6BA">Ver en agenda ›</div>
        </div>
      </div>
    </sc-if>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
      <sc-for list="{{ kpisEst }}" as="k" hint-placeholder-count="3">
        <div sc-camel-on-click="{{ k.go }}" style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:13px 11px;cursor:pointer">
          <div style="font:800 22px/1 Manrope,sans-serif;letter-spacing:-.03em;color:{{ k.color }}">{{ k.value }}</div>
          <div style="font:700 8.5px/1.2 Manrope,sans-serif;letter-spacing:.1em;color:#8E9AAE;margin-top:9px">{{ k.label }}</div>
        </div>
      </sc-for>
    </div>

    <div style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px">
        <div style="font:800 13px/1 Manrope,sans-serif">Próximas entregas</div>
        <div sc-camel-on-click="{{ goEstudio }}" style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#9AA6BA;cursor:pointer">VER AGENDA</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
        <sc-for list="{{ urgentAcad }}" as="u" hint-placeholder-count="4">
          <div sc-camel-on-click="{{ u.go }}" style="border-left:3px solid {{ u.color }};background:rgba(255,255,255,.03);border-radius:4px 12px 12px 4px;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font:700 13px/1.25 Manrope,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ u.title }}</div>
              <div style="font:700 9.5px/1.2 Manrope,sans-serif;letter-spacing:.06em;color:#8E9AAE;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ u.badge }} · {{ u.meta }}</div>
            </div>
            <div style="flex:none;text-align:right">
              <div style="font:700 12px/1 Manrope,sans-serif;color:{{ u.color }}">{{ u.right }}</div>
              <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.08em;color:#8E9AAE;margin-top:7px">{{ u.plazo }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="background:#121724;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px 14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 2px">
        <div style="font:800 13px/1 Manrope,sans-serif">Carga por semana</div>
        <div style="font:700 9px/1 Manrope,sans-serif;letter-spacing:.12em;color:#8E9AAE">PRÓX. 6 SEMANAS</div>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:96px;margin-top:16px;padding:0 2px">
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="6">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px">
            <div style="font:700 10px/1 Manrope,sans-serif;color:{{ b.fg }}">{{ b.n }}</div>
            <div style="width:100%;border-radius:6px 6px 3px 3px;background:{{ b.bg }};height:{{ b.h }}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;justify-content:space-between;gap:8px;margin-top:9px;padding:0 2px">
        <sc-for list="{{ bars }}" as="b2" hint-placeholder-count="6">
          <div style="flex:1;text-align:center;font:700 9px/1 Manrope,sans-serif;letter-spacing:.04em;color:#8E9AAE">{{ b2.label }}</div>
        </sc-for>
      </div>
    </div>

    <div sc-camel-on-click="{{ goEjercicio }}" style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);cursor:pointer">
      <div style="width:6px;height:6px;flex:none;border-radius:50%;background:{{ dayColor }}"></div>
      <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.14em;color:#6C7789">GIMNASIO HOY</div>
      <div style="flex:1;min-width:0;font:700 12px/1 Manrope,sans-serif;color:#B8C2D2;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ gymLine }}</div>
      <div style="flex:none;width:5px;height:5px;border-top:1.6px solid #4A566B;border-right:1.6px solid #4A566B;transform:rotate(45deg)"></div>
    </div>

    <div sc-camel-on-click="{{ goFinanzas }}" style="display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);cursor:pointer">
      <div style="width:6px;height:6px;flex:none;border-radius:50%;background:#57B9A0"></div>
      <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.14em;color:#6C7789">LIBRETICAS</div>
      <div style="flex:1;min-width:0;font:700 12px/1 Manrope,sans-serif;color:#B8C2D2;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ finLine }}</div>
      <div style="flex:none;width:5px;height:5px;border-top:1.6px solid #4A566B;border-right:1.6px solid #4A566B;transform:rotate(45deg)"></div>
    </div>
  </div>
</div>
</sc-if>

<sc-if value="{{ isEjercicio }}">
<div data-pantalla="ejercicio" style="flex:1;min-height:0;display:flex;flex-direction:column;position:relative">
  <div data-cabecera data-vidrio="cabecera" style="position:absolute;top:0;left:0;right:0;z-index:30">
  <div style="padding:calc(env(safe-area-inset-top,0px) + 12px) 60px 12px;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px">
    <div style="font:700 9.5px/1 Manrope,sans-serif;letter-spacing:.16em;color:#4A566B">{{ dayHeader }}</div>
    <div style="font:italic 300 33px/1.12 Newsreader,Georgia,serif;letter-spacing:-.01em;color:#EDF1F7;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ dayGroup }}</div>
    <div style="font:800 9.5px/1 Manrope,sans-serif;letter-spacing:.1em;color:{{ dayColor }};padding:5px 9px;border-radius:7px;background:{{ dayChipBg }}">{{ dayChip }}</div>
    <div sc-camel-on-click="{{ abrirRutina }}" aria-label="Tu rutina" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;width:44px;height:44px;border-radius:12px;background:rgba(87,185,160,.12);border:1px solid rgba(87,185,160,.32);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#57B9A0" stroke-linecap="round">
        <path d="M6 11h10" stroke-width="2"></path>
        <path d="M5 7v8M17 7v8" stroke-width="2.4"></path>
        <path d="M2.5 9v4M19.5 9v4" stroke-width="2"></path>
      </svg>
    </div>
    <div sc-camel-on-click="{{ openPanel }}" style="position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:44px;height:44px;border-radius:12px;background:#121724;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;cursor:pointer">
  <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9AA6BA" stroke-linecap="round">
        <path stroke-width="4.6" d="M20.2 12 L21.2 12 M3.8 12 L2.8 12 M12 20.2 L12 21.2 M12 3.8 L12 2.8 M17.8 17.8 L18.5 18.5 M6.2 6.2 L5.5 5.5 M6.2 17.8 L5.5 18.5 M17.8 6.2 L18.5 5.5"></path>
        <circle cx="12" cy="12" r="7.4" stroke-width="5.2"></circle>
      </svg>
      <sc-if value="{{ avisosBadge }}"><div style="position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:#C46461;border:2px solid #090C14;font:800 10px/16px Manrope,sans-serif;color:#fff;text-align:center">{{ avisosBadgeTxt }}</div></sc-if>
      <sc-if value="{{ editOn }}"><div style="position:absolute;bottom:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#CE7F55;border:2px solid #090C14"></div></sc-if>
    </div>
  </div>
  </div>

  <div data-desplaza style="flex:1;min-height:0;overflow:auto;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 112px)">
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 14px 10px">
      <sc-for list="{{ week }}" as="d" hint-placeholder-count="7">
        <div data-dia="{{ d.i }}" sc-camel-on-click="{{ d.select }}" style="position:relative;min-width:0;padding:7px 0 6px;border-radius:10px;cursor:pointer;text-align:center;background:{{ d.bg }};border:1px solid {{ d.border }}" style-active="transform:translateY(1px)">
          <div style="font:700 8.5px/1 Manrope,sans-serif;letter-spacing:.04em;color:{{ d.sub }}">{{ d.dow }}</div>
          <div style="font:800 16px/1.15 Manrope,sans-serif;color:{{ d.fg }};margin-top:3px">{{ d.n }}</div>
          <div style="font:800 10px/1.1 Manrope,sans-serif;letter-spacing:.02em;margin-top:3px;color:{{ d.abbrColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.abbr }}</div>
          <div style="width:4px;height:4px;border-radius:2px;margin:4px auto 0;background:{{ d.dot }};border:1px solid {{ d.dotBorder }}"></div>
        </div>
      </sc-for>
    </div>

    <div data-deslizar-dias>
    <sc-if value="{{ esDescanso }}">
      <div style="margin:4px 14px 0;padding:30px 22px;border-radius:16px;border:1px dashed rgba(255,255,255,.12);text-align:center">
        <div style="font:italic 300 26px/1.2 Newsreader,Georgia,serif;letter-spacing:-.01em;color:#EDF1F7">Día de descanso</div>
      </div>
    </sc-if>
    <sc-if value="{{ grupoVacio }}">
      <div sc-camel-on-click="{{ abrirRutina }}" style="margin:4px 14px 0;padding:26px 22px;border-radius:16px;border:1px dashed rgba(87,185,160,.35);text-align:center;cursor:pointer">
        <div style="font:700 15px/1.3 Manrope,sans-serif;color:#EDF1F7">Este grupo aún no tiene ejercicios</div>
        <div style="font:600 12.5px/1.5 Manrope,sans-serif;color:#57B9A0;margin-top:8px">Agrégalos en Tu rutina ›</div>
      </div>
    </sc-if>
    <sc-if value="{{ hayRutina }}">
    <div style="padding:0 14px">
      <div style="background:#121724;border:1px solid #1D2534;border-radius:14px;padding:12px 13px;display:flex;gap:11px;align-items:center">
        <div style="position:relative;width:50px;height:50px;flex:none">
          <svg width="50" height="50" viewBox="0 0 61 61">
            <circle cx="30.5" cy="30.5" r="26" fill="none" stroke="#28324A" stroke-width="5.5"></circle>
            <circle cx="30.5" cy="30.5" r="26" fill="none" stroke="{{ ringColor }}" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="{{ ringOffset }}" transform="rotate(-90 30.5 30.5)"></circle>
          </svg>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 12.5px/1 Manrope,sans-serif;color:{{ ringColor }}">{{ pctText }}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font:700 14.5px/1.2 Manrope,sans-serif">{{ seriesText }}</div>

          <div style="display:flex;gap:9px;margin-top:14px">
            <div sc-camel-on-click="{{ vRechazar }}" style="flex:1;padding:16px;border-radius:12px;text-align:center;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font:700 13.5px/1 Manrope,sans-serif;color:#8E9AAE">Rechazar</div>
            <div sc-camel-on-click="{{ vAceptar }}" style="flex:1.6;padding:16px;border-radius:12px;text-align:center;cursor:pointer;background:#57B9A0;font:800 13.5px/1 Manrope,sans-serif;color:#0A0E1A">Aceptar</div>
          </div>
        </sc-if>
      </sc-if>
    </div>
  </div>
</sc-if>

<!-- Elegir amigo: para «Compartir con» (libreticas) y «Para» (actividades).
     La cabecera y el buscador se quedan arriba mientras la lista corre debajo;
     con buscador la hoja tiene alto fijo para que no salte al filtrar. -->
<sc-if value="{{ elegirOn }}">
  <div data-hoja-fondo="elegir" style="position:absolute;inset:0;z-index:100;display:flex;align-items:flex-end">
    <div data-hoja-velo style="position:absolute;inset:0;background:rgba(3,5,10,.62)"></div>
    <div data-hoja="elegir" role="dialog" aria-label="{{ elegirTitulo }}" style="position:relative;box-sizing:border-box;width:100%;height:{{ elegirAlto }};max-height:calc(100% - env(safe-area-inset-top,0px) - 44px);overflow:auto;overscroll-behavior:contain;background:#0E131F;border-top:1px solid rgba(255,255,255,.1);border-radius:28px 28px 0 0;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 28px)">
      <div style="position:sticky;top:0;z-index:1;margin:0 -22px;padding:10px 22px 14px;background:#0E131F">
        <div style="width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 16px"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div style="min-width:0;font:800 22px/1.15 Manrope,sans-serif;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ elegirTitulo }}</div>
          <div sc-camel-on-click="{{ cerrarElegir }}" role="button" aria-label="Cerrar" style="flex:none;width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8E9AAE">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"></path></svg>
          </div>
        </div>
        <sc-if value="{{ elegirBuscarOn }}">
          <div style="position:relative;margin-top:16px">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8E9AAE" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:13px;top:14px;pointer-events:none"><circle cx="7" cy="7" r="5"></circle><path d="M10.8 10.8l3.4 3.4"></path></svg>
            <input data-elegir-buscar type="text" inputmode="search" enterkeyhint="search" value="{{ elegirQ }}" sc-camel-on-change="{{ onElegirQ }}" placeholder="Buscar amigo" aria-label="Buscar amigo" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="40" style="width:100%;box-sizing:border-box;height:44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font:600 16px Manrope,sans-serif;padding:0 44px 0 38px">
            <sc-if value="{{ elegirQ }}">
              <div sc-camel-on-click="{{ limpiarElegirQ }}" role="button" aria-label="Borrar la búsqueda" style="position:absolute;right:5px;top:6px;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="rgba(255,255,255,.16)"></circle><path d="M6.3 6.3l5.4 5.4M11.7 6.3l-5.4 5.4" stroke="#DCE2EC" stroke-width="1.6" stroke-linecap="round"></path></svg>
              </div>
            </sc-if>
          </div>
        </sc-if>
        <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:-16px;height:16px;background:linear-gradient(#0E131F,rgba(14,19,31,0));pointer-events:none"></div>
      </div>

      <div role="listbox" aria-label="{{ elegirTitulo }}" style="display:flex;flex-direction:column;gap:6px;padding-top:2px">
        <sc-for list="{{ elegirFilas }}" as="ef" hint-placeholder-count="6">
          <div sc-camel-on-click="{{ ef.pick }}" role="option" aria-selected="{{ ef.sel }}" style="min-height:58px;box-sizing:border-box;padding:10px 12px;border-radius:13px;background:{{ ef.fondo }};border:1px solid {{ ef.borde }};display:flex;align-items:center;gap:12px;cursor:pointer">
            <div style="width:36px;height:36px;flex:none;border-radius:50%;background:{{ ef.color }};display:flex;align-items:center;justify-content:center;font:800 13px/1 Manrope,sans-serif;color:#0A0E1A">{{ ef.inicial }}</div>
            <div style="flex:1;min-width:0">
              <div style="font:700 15px/1.2 Manrope,sans-serif;color:#EDF1F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ ef.nombre }}</div>
              <sc-if value="{{ ef.sub }}">
                <div style="font:600 11.5px/1.3 Manrope,sans-serif;color:#8E9AAE;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ ef.sub }}</div>
              </sc-if>
            </div>
            <div style="width:24px;height:24px;flex:none;box-sizing:border-box;border-radius:50%;background:{{ ef.marca }};border:1.6px solid {{ ef.marcaBorde }};display:flex;align-items:center;justify-content:center">
              <div style="width:9px;height:5px;border-left:2px solid {{ ef.tick }};border-bottom:2px solid {{ ef.tick }};transform:rotate(-45deg);margin-top:-2px"></div>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ elegirVacio }}">
        <div role="status" style="padding:34px 12px 8px;text-align:center">
          <div style="font:700 14px/1.4 Manrope,sans-serif;color:#EDF1F7">{{ elegirVacio }}</div>
        </div>
      </sc-if>
    </div>
  </div>
</sc-if>

</sc-if>

</div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
<script src="viewport.js"></script>
<script src="runtime.js"></script>
<script src="nube.js"></script>
<script src="orbe.js"></script>
<script src="fluido.js"></script>
<script src="app.js"></script>
</body>
</html>
